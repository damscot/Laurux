# Base de données jetable des tests de non-régression (phase 2 du rework).
# Utilisée par .src/Tests/Framework/runner.py ; à lancer depuis ce répertoire :
#   docker compose -p laurux-test-13306 -f docker-compose.test.yml up -d --build --wait
#   docker compose -p laurux-test-13306 -f docker-compose.test.yml down
# Plusieurs bases en parallèle (un agent par base) : LAURUX_TEST_DB_PORT=13307 et -p laurux-test-13307.
#
# Données en tmpfs (rapide, rien ne persiste). Port lié à la boucle locale uniquement.
# LAURUX_SQL_MODE : sql_mode du serveur. Défaut NO_ENGINE_SUBSTITUTION (non strict), comme en production :
# Fmenu.class:175 force « SET @@global.sql_mode=NO_ENGINE_SUBSTITUTION » à chaque démarrage de Laurux.

services:
  db:
    build:
      context: .
      target: db
    image: laurux-db:10.11
    environment:
      LAURUX_USER: laurux
      LAURUX_PASSWORD: laurux
      MARIADB_ROOT_PASSWORD: laurux-root
      TZ: UTC
    command:
      - "--sql-mode=${LAURUX_SQL_MODE-NO_ENGINE_SUBSTITUTION}"
    ports:
      - "127.0.0.1:${LAURUX_TEST_DB_PORT:-13306}:3306"
    tmpfs:
      - /var/lib/mysql:rw,size=1g
    volumes:
      # marqueur « serveur de test » posé à chaque initialisation (voir le script) : nettoyage des bases autorisé
      - ./mysql/test/90-marqueur-serveur-test.sql:/docker-entrypoint-initdb.d/90-marqueur-serveur-test.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Environnement d'exécution des tests (gb.test, rejeux GUI sous Xvfb). Lancé à la demande par runner.py :
  #   docker compose -p laurux-test-<port> -f docker-compose.test.yml --profile runner run --rm -v … runner …
  # Aucun paquet installé : /usr et /etc de l'hôte montés en lecture seule (mêmes Gambas, Xvfb, faketime, xdotool,
  # client MariaDB que le poste). Seul le HOME est isolé : /etc/passwd généré par le runner (User.Home de Gambas
  # = /home/laurux) et /home/laurux, /tmp en tmpfs, propres à chaque conteneur jetable. Les dépôts sont montés
  # par le runner à leur chemin réel. Réseau du projet compose : base « db » propre à chaque bac.
  runner:
    image: ubuntu:24.04
    profiles: ["runner"]
    depends_on:
      db:
        condition: service_healthy
    user: "${LAURUX_UID:-1000}:${LAURUX_GID:-1000}"
    environment:
      HOME: /home/laurux
      USER: laurux
      LAURUX_IN_DOCKER: "1"
      LAURUX_TEST_DB_HOST: db
      LAURUX_TEST_DB_PORT: "3306"
    volumes:
      - /usr:/usr:ro
      - /etc:/etc:ro
      - ${LAURUX_PASSWD:-/dev/null}:/etc/passwd:ro
      - ${LAURUX_GROUP:-/dev/null}:/etc/group:ro
    tmpfs:
      - /home/laurux:exec,uid=${LAURUX_UID:-1000},gid=${LAURUX_GID:-1000},mode=0700
      - /tmp:exec,mode=1777
    shm_size: 256m
